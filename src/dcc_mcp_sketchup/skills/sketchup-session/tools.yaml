tools:
  - name: get_status
    description: Verify the authenticated SketchUp bridge and return host metadata.
    source_file: scripts/get_status.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: inspect_model
    description: Inspect model identity, bounds, root entity counts, materials, scenes, tags, and selection.
    source_file: scripts/inspect_model.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: list_entities
    description: List bounded root-model entities with persistent IDs and optional type filtering.
    source_file: scripts/list_entities.py
    input_schema:
      type: object
      properties:
        kind: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 500, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: save_copy
    description: Save a new versioned copy inside the project folder. Refuses an existing path and the source path. There is no overwrite.
    source_file: scripts/save_copy.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {path: "C:/projects/reno/concept v1.0.skp"}
        note: Save a new versioned copy. The file name is "<name> v<major>.<minor>.skp".

  - name: validate_model
    description: Validate the model and report invalid root entities without modifying it.
    source_file: scripts/validate_model.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: import_model
    description: Import an existing model file with host-supported importer options.
    source_file: scripts/import_model.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        options:
          type: object
          default: {}
          maxProperties: 64
          propertyNames: {pattern: "^[a-z][a-z0-9_]{0,63}$"}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 600
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: true, deferred_hint: true}
    call_examples:
      - arguments: {path: "C:/exchange/source.dae", options: {}}
        note: Import a COLLADA model generated by Blender

  - name: export_model
    description: Export the active model through a host-supported exporter to an absolute path.
    source_file: scripts/export_model.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        options:
          type: object
          default: {}
          maxProperties: 64
          propertyNames: {pattern: "^[a-z][a-z0-9_]{0,63}$"}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 600
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {path: "C:/projects/reno/sketchup-scene.dae", options: {}}
        note: Export into the configured project folder. An existing file is refused.

  - name: validate_spec
    description: Read-only comparison of the model to a spec. Returns MATCH, MISMATCH, or BLOCK with specified, available, and delta inches. Walls tolerate ±1/8 inch. Appliances tolerate 0. Never edits the model.
    source_file: scripts/validate_spec.py
    input_schema:
      type: object
      required: [spec]
      properties:
        spec:
          type: object
          required: [elements]
          properties:
            elements:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [id, type, x, y, z, width, depth, height]
                properties:
                  id: {type: integer, minimum: 1}
                  type: {type: string, enum: [wall, appliance]}
                  x: {type: number}
                  y: {type: number}
                  z: {type: number}
                  width: {type: number}
                  depth: {type: number}
                  height: {type: number}
                  unit: {type: string, enum: [inches], default: inches}
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: outliner
    description: Read the Outliner hierarchy, including nested groups and component instances, persistent IDs, entity IDs, and attribute dictionaries. Does not move geometry.
    source_file: scripts/outliner.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
