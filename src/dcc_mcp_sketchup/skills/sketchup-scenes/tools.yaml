tools:
  - name: list_scenes
    description: List saved scenes with descriptions and animation state.
    source_file: scripts/list_scenes.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_scene
    description: Capture the current view as a uniquely named scene.
    source_file: scripts/create_scene.py
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        include_in_animation: {type: boolean, default: true}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: false}

  - name: update_scene
    description: Rename, describe, recapture, or change animation inclusion for a scene.
    source_file: scripts/update_scene.py
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        new_name: {type: string, minLength: 1}
        description: {type: string}
        include_in_animation: {type: boolean}
        capture_current_view: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: remove_scene
    description: Remove a named saved scene; the operation remains undoable.
    source_file: scripts/remove_scene.py
    input_schema:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}

  - name: list_tags
    description: List Tags, visibility, active state, and the protected default tag.
    source_file: scripts/list_tags.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_tag
    description: Create a uniquely named SketchUp Tag with optional visibility.
    source_file: scripts/create_tag.py
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        visible: {type: boolean, default: true}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: false}

  - name: assign_tag
    description: Assign a Tag to an entity by persistent ID.
    source_file: scripts/assign_tag.py
    input_schema:
      type: object
      required: [entity_id, tag]
      properties:
        entity_id: {type: integer, minimum: 1}
        tag: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: remove_tag
    description: Remove an unused non-default Tag, refusing deletion while assigned.
    source_file: scripts/remove_tag.py
    input_schema:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}

  - name: organize_categories
    description: Ensure category tag folders (Roof, Slab, Walls – Bedroom, and the rest of the category list) and a tag in each folder. Does not move geometry. Proves that with a before/after bounds check.
    source_file: scripts/organize_categories.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: organize_rooms
    description: Place single-room entities in a named room group and log shared entities under every room without splitting or moving them. Bounds are checked before and after.
    source_file: scripts/organize_rooms.py
    input_schema:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [name, entity_ids]
            properties:
              name: {type: string, minLength: 1}
              entity_ids:
                type: array
                minItems: 1
                maxItems: 500
                uniqueItems: true
                items: {type: integer, minimum: 1}
            additionalProperties: false
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: false}
